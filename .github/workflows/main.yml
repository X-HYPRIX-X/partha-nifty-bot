name: Partha Algo Scanner

on:
  schedule:
    # Runs every 5 minutes from 3:45 AM to 10:00 AM UTC (9:15 AM to 3:30 PM IST) Monday to Friday
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Modules
        run: pip install yfinance pandas numpy requests

      - name: Run Algo
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
